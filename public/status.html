<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>สถานะตู้อุปกรณ์กีฬา | Sports Equipment Box</title>
<style>
*{box-sizing:border-box}body{margin:0;font:16px Tahoma,sans-serif;background:#f3f6fb;color:#243447}.wrap{max-width:960px;margin:auto;padding:24px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}.head h1{font-size:24px;margin:0 0 8px;display:flex;align-items:center;gap:10px}.school-logo{width:42px;height:42px;object-fit:contain;border-radius:50%;vertical-align:middle}.muted{color:#78869a;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card{background:white;border:1px solid #e3eaf2;border-radius:14px;padding:20px;display:flex;align-items:center;gap:14px}.icon{font-size:27px;background:#eaf7ef;border-radius:12px;padding:12px}.icon.busy{background:#fff0ef}.name{font-weight:bold;margin:5px 0 10px}.pill{display:inline-block;border-radius:30px;background:#e4f7eb;color:#137a43;padding:5px 10px;font-size:13px}.pill.busy{background:#fff0ef;color:#b42318}.panel{background:#fff;border:1px solid #e3eaf2;border-radius:12px;padding:16px;margin-top:16px}.history-wrap{max-height:350px;overflow-y:auto;overflow-x:auto;overscroll-behavior:contain;scrollbar-width:thin}.history thead th{position:sticky;top:0;z-index:2;background:#f7f9fc;box-shadow:0 1px 0 #e3eaf2}.history{width:100%;border-collapse:collapse;margin-top:10px;min-width:520px}.history th,.history td{text-align:left;padding:10px;border-bottom:1px solid #e8edf3;font-size:14px}.history th{color:#65758b;background:#f7f9fc}.holder{margin-top:8px;font-size:14px;color:#6a3a12}.holder b{color:#243447}.btn{border:0;border-radius:8px;padding:10px 14px;background:#1769aa;color:white;font:inherit;cursor:pointer}.error{color:#b42318}.empty{background:#fff;border-radius:12px;padding:20px;color:#78869a}@media(max-width:500px){.wrap{padding:15px}.head h1{font-size:21px}}

.action-borrow,.action-return{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-weight:700;font-size:13px;white-space:nowrap}
.action-borrow{background:#fff2d5;color:#925900;border:1px solid #f7df9e}
.action-return{background:#def8e8;color:#166534;border:1px solid #b8ebc9}
.history tr:hover td{background:#f8fafc}

/* Public status: retain the dark appearance and show actual access permission. */
body{background:#101820;color:#e8edf4}.panel,.card,.empty{background:#1c2b39;border-color:#304253;color:#e8edf4}.muted{color:#a8b6c6}.name,.holder b{color:#f0f4fa}.history th,.history thead th{background:#233647;color:#c6d1dd}.history td{border-color:#304253}.history tr:hover td{background:#25394a}.btn{background:#2784bf}.access-label{font-size:14px;color:#b8c5d3;margin-bottom:12px}.access-state{display:flex;align-items:center;gap:12px;font-size:25px;font-weight:bold}.access-state .symbol{font-size:25px}.access-note{color:#b8c5d3;margin-top:12px}.access-state.open .symbol{color:#40d98a}.access-state.closed .symbol{color:#ff7373}.access-state.special .symbol{color:#f8c55b}

/* Theme switch: light and dark, preserving the existing layout */
html[data-theme="light"] body{background:#f3f6fb;color:#243447}
html[data-theme="light"] .panel,html[data-theme="light"] .card,html[data-theme="light"] .empty{background:#fff;border-color:#e3eaf2;color:#243447}
html[data-theme="light"] .muted{color:#65758b}
html[data-theme="light"] .name,html[data-theme="light"] .holder b{color:#243447}
html[data-theme="light"] .history th,html[data-theme="light"] .history thead th{background:#f7f9fc;color:#65758b}
html[data-theme="light"] .history td{border-color:#e8edf3}
html[data-theme="light"] .history tr:hover td{background:#f8fafc}
html[data-theme="light"] .access-label,html[data-theme="light"] .access-note{color:#65758b}
.theme-btn{background:transparent!important;color:inherit;border:1px solid currentColor!important;cursor:pointer}
.head-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
</style></head><body><main class="wrap"><header class="head"><div><h1><img class="school-logo" src="/school-emblem.png" alt="ตราโรงเรียน">สถานะตู้อุปกรณ์กีฬา</h1><div class="muted">Sports Equipment Box · หน้านี้สำหรับดูสถานะเท่านั้น</div></div><div class="head-actions"><button class="btn theme-btn" id="themeToggle" type="button" onclick="toggleTheme()" aria-label="เปลี่ยนธีม">☀ ธีมสว่าง</button><button class="btn" onclick="loadStatus()">↻ รีเฟรช</button></div></header><section id="access" class="panel" aria-live="polite"><div class="access-label">สถานะระบบควบคุมตู้</div><div class="access-state">กำลังโหลดสถานะ...</div></section><div id="summary" class="panel">กำลังโหลดสถานะ...</div><section id="keys" class="grid" aria-live="polite" style="margin-top:14px"></section><section class="panel"><h2 style="font-size:19px;margin:0">ประวัติการยืม-คืนล่าสุด</h2><div class="muted" style="margin-top:6px">แสดง 50 รายการล่าสุด · เลื่อนภายในตารางเพื่อดูเพิ่มเติม</div><div id="history" class="history-wrap">กำลังโหลดประวัติ...</div></section><div class="panel"><div class="muted" id="updated">กำลังตรวจสอบข้อมูลล่าสุด...</div><div class="muted" style="margin-top:8px">ระบบจะอัปเดตอัตโนมัติทุก 5 วินาที</div></div></main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function loadStatus(){const summary=document.getElementById('summary'),list=document.getElementById('keys'),updated=document.getElementById('updated');try{const r=await fetch('/api/public/status',{cache:'no-store'});if(!r.ok)throw Error('โหลดข้อมูลไม่สำเร็จ');const d=await r.json(),keys=d.keys||[],history=d.history||[],free=keys.filter(k=>k.status==='ว่าง').length,busy=keys.length-free;const access=d.access;const accessBox=document.getElementById('access');if(access&&typeof access.allowed==='boolean'){const special=access.mode==='override'&&access.allowed;const label=special?'Admin เปิดพิเศษ':access.allowed?'เปิดใช้งาน':'ปิดใช้งาน';const cls=special?'special':access.allowed?'open':'closed';const icon=special?'★':access.allowed?'✓':'✕';const note=special?'อนุญาตให้ใช้งานนอกเวลาได้ชั่วคราว (สูงสุด 30 นาที)':access.mode==='off'?'ผู้ดูแลระบบปิดการใช้งานตู้':'เวลาให้บริการ 07:00–19:00 น.';accessBox.innerHTML=`<div class="access-label">สถานะระบบควบคุมตู้</div><div class="access-state ${cls}"><span class="symbol">${icon}</span><span>${label}</span></div><div class="access-note">${note}</div>`}else{accessBox.innerHTML='<div class="access-label">สถานะระบบควบคุมตู้</div><div class="access-note">ไม่พบข้อมูลสถานะการเปิดตู้</div>';}summary.innerHTML=`ทั้งหมด <b>${keys.reduce((n,k)=>n+k.total_qty,0)}</b> ชิ้น/ชุด · คงเหลือ <b>${keys.reduce((n,k)=>n+k.available_qty,0)}</b> · ถูกยืม <b>${keys.reduce((n,k)=>n+k.total_qty-k.available_qty,0)}</b>`;list.innerHTML=keys.map(k=>{const isFree=k.status==='ว่าง';return `<article class="card"><div class="icon ${isFree?'':'busy'}">⚽</div><div><div class="muted">ช่องที่ ${k.id}</div><div class="name">${esc(k.name)}</div><div class="muted">คงเหลือ ${k.available_qty} / ${k.total_qty} ชิ้น/ชุด</div><span class="pill ${isFree?'':'busy'}">● ${isFree?'ว่าง':'ถูกยืม'}</span>${!isFree&&k.holder?`<div class="holder">ผู้ยืม: <b>${esc(k.holder)}</b></div>`:''}</div></article>`}).join('')||'<div class="empty">ยังไม่มีช่องอุปกรณ์ในระบบ</div>';const historyBox=document.getElementById('history'),scrollY=historyBox.scrollTop,scrollX=historyBox.scrollLeft;historyBox.innerHTML=history.length?`<table class="history"><thead><tr><th>วัน-เวลา</th><th>อุปกรณ์กีฬา</th><th>รายการ</th><th>ผู้ยืม/ผู้คืน</th></tr></thead><tbody>${history.map(h=>`<tr><td>${esc(h.time)}</td><td>${esc(h.key_name)}</td><td>${h.action==='คืน'?'<span class="action-return">✓ คืนแล้ว</span>':h.action==='ยืม'?'<span class="action-borrow">⚽ ยืม</span>':esc(h.action)}</td><td>${esc(h.username)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">ยังไม่มีประวัติการยืม-คืน</div>';historyBox.scrollTop=scrollY;historyBox.scrollLeft=scrollX;updated.textContent='อัปเดตล่าสุด: '+new Date(d.updatedAt||Date.now()).toLocaleString('th-TH')}catch(e){summary.innerHTML='<span class="error">ไม่สามารถโหลดสถานะได้ กรุณาลองใหม่</span>';updated.textContent=''}}
function applyTheme(theme){
  const selected=theme==='light'?'light':'dark';
  document.documentElement.setAttribute('data-theme',selected);
  const btn=document.getElementById('themeToggle');
  if(btn)btn.textContent=selected==='dark'?'☀ ธีมสว่าง':'☾ ธีมมืด';
  try{localStorage.setItem('sk3-status-theme',selected)}catch(e){}
}
function toggleTheme(){applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark')}
let savedTheme='dark';try{savedTheme=localStorage.getItem('sk3-status-theme')||'dark'}catch(e){}
applyTheme(savedTheme);
loadStatus();setInterval(loadStatus,5000);
</script></body></html>
